name: ESP32-C3 build and Wokwi simulation
on:
  push:
    branches: [test]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Build Wokwi firmware
        run: pio run -e wokwi
      - name: Build real XIAO firmware
        run: pio run -e xiao_esp32c3
      - name: Run Wokwi simulation (requires WOKWI_CLI_TOKEN secret)
        if: ${{ env.WOKWI_CLI_TOKEN != '' }}
        uses: wokwi/wokwi-ci-action@v1
        env:
          WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
        with:
          token: ${{ secrets.WOKWI_CLI_TOKEN }}
          path: /
          timeout: 10000
          expect_text: '[SIMULATION] BLE disabled'
